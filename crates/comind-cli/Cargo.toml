[package]
name = "comind-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "comind"
path = "src/main.rs"

[dependencies]
comind-core = { workspace = true }
comind-parse = { workspace = true }
comind-index = { workspace = true }
comind-resolve = { workspace = true }
comind-graph = { workspace = true }
comind-mcp = { workspace = true }
comind-embed = { workspace = true }
comind-llm = { workspace = true }
comind-git = { path = "../comind-git" }
tokio = { version = "1.53", features = ["rt-multi-thread"] }
