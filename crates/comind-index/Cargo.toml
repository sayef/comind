[package]
name = "comind-index"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
comind-core.workspace = true
# Build Arrow types from lancedb's re-exports (lancedb::arrow::*) so we always match the
# exact arrow line it was compiled against — no direct arrow deps (see lancedb#3575).
lancedb = { version = "0.31.0", default-features = false, features = ["aws"] }
# For FullTextSearchQuery (BM25/FTS) — pinned to the exact version lancedb uses.
lance-index = "=8.0.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros"] }
futures = "0.3"
serde_json.workspace = true
