[package]
name = "comind"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/sayef/comind"
authors = ["Comind"]
description = "Deterministic, cross-repo code intelligence for coding agents — self-hosted, single binary."

# Library (the engine, one module per stage) + the `comind` binary. main.rs uses the lib as `comind::`.
[lib]
name = "comind"
path = "src/lib.rs"

[[bin]]
name = "comind"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "io-std"] }
futures = "0.3"
rayon = "1"
ignore = "=0.4.23"
petgraph = "0.8.3"
git2 = { version = "0.21.0", default-features = false, features = ["vendored-libgit2"] }
tree-sitter = "0.25"
tree-sitter-python = "0.23"
tree-sitter-typescript = "0.23"
model2vec-rs = "0.2.1"
# Arrow types come from lancedb's re-exports (lancedb::arrow::*) to match its exact arrow line.
lancedb = { version = "0.31.0", default-features = false, features = ["aws"] }
lance-index = "=8.0.0" # for FullTextSearchQuery (BM25/FTS); pinned to lancedb's version
async-openai = { version = "0.41.1", features = ["chat-completion"] } # opt-in enrichment
rmcp = { version = "2.2.0", features = ["server", "transport-io"] } # MCP server

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Keep target/ small on a tight disk: no debug-info for third-party deps
# (our own code keeps line tables for usable backtraces).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
