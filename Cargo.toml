[workspace]
resolver = "2"
members = [
    "crates/comind-core",
    "crates/comind-git",
    "crates/comind-parse",
    "crates/comind-resolve",
    "crates/comind-index",
    "crates/comind-graph",
    "crates/comind-embed",
    "crates/comind-llm",
    "crates/comind-mcp",
    "crates/comind-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/sayef/comind"
authors = ["Comind"]

[workspace.dependencies]
comind-core = { path = "crates/comind-core" }
comind-parse = { path = "crates/comind-parse" }
comind-resolve = { path = "crates/comind-resolve" }
comind-index = { path = "crates/comind-index" }
comind-graph = { path = "crates/comind-graph" }
comind-embed = { path = "crates/comind-embed" }
comind-llm = { path = "crates/comind-llm" }
comind-mcp = { path = "crates/comind-mcp" }
# Shared third-party (added to member crates as each phase lands)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Keep target/ small on a tight disk: no debug-info for third-party deps
# (our own crates keep line tables for usable backtraces).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

