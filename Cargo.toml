[package]
name = "comind"
version = "0.2.1"
edition = "2021"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/sayef/comind"
authors = ["Saiful Islam"]
description = "Deterministic, always-fresh, cross-repo code intelligence for coding agents — self-hosted, single binary."
readme = "README.md"
homepage = "https://github.com/sayef/comind"
keywords = ["code-intelligence", "mcp", "agents", "tree-sitter", "code-search"]
categories = ["development-tools", "command-line-utilities"]
# Dev-only files that shouldn't ship in the published crate (rust-toolchain.toml would otherwise
# force our pinned toolchain on anyone running `cargo install`).
exclude = ["rust-toolchain.toml", ".github", ".pre-commit-config.yaml", "docs"]

# Library (the engine, one module per stage) + the `comind` binary. main.rs uses the lib as `comind::`.
[lib]
name = "comind"
path = "src/lib.rs"

[[bin]]
name = "comind"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
indicatif = "0.18" # stderr progress bars / spinners (auto-degrade off-TTY)
console = "0.16" # styled status lines + TTY detection
comfy-table = "7" # unicode result tables
anyhow = "1"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "io-std"] }
futures = "0.3"
rayon = "1"
ignore = "=0.4.23"
petgraph = "0.8.3"
git2 = { version = "0.21.0", default-features = false, features = ["vendored-libgit2"] }
tree-sitter = "0.25"
tree-sitter-python = "0.23"
tree-sitter-typescript = "0.23"
model2vec-rs = "0.2.1"
# Arrow types come from lancedb's re-exports (lancedb::arrow::*) to match its exact arrow line.
lancedb = { version = "0.31.0", default-features = false, features = ["aws"] }
lance-index = "=8.0.0" # for FullTextSearchQuery (BM25/FTS); pinned to lancedb's version
# LLM enrichment via Rig — provider-agnostic (OpenAI now; Bedrock/Vertex/others behind features later).
rig-core = "0.36"
rmcp = { version = "2.2.0", features = ["server", "transport-io"] } # MCP server

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Keep target/ small on a tight disk: no debug-info for third-party deps
# (our own code keeps line tables for usable backtraces).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
