repos:
-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
    -   id: mypy
        args: [--ignore-missing-imports, --install-types, --non-interactive, --python-version=3.13, --explicit-package-bases, --no-strict-optional, --allow-untyped-defs]

-   repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
    -   id: pyupgrade
        args: [--py313-plus]

-   repo: https://github.com/pappasam/toml-sort
    rev: v0.24.3
    hooks:
    -   id: toml-sort
        entry: toml-sort
        language: python
        args: [--all, --in-place, --ignore-case, --sort-first, "poetry,name,version"]
        types: [ toml ]

-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.9
    hooks:
    - id: ruff-check
      args: [ --fix ]
    - id: ruff-format