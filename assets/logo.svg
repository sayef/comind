<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="comind logo">
  <title>comind</title>
  <!-- hexagon of 6 nodes = a code graph -->
  <path d="M60 20 L94.64 40 L94.64 80 L60 100 L25.36 80 L25.36 40 Z"
        fill="none" stroke="#2F5BD0" stroke-width="4" stroke-linejoin="round"/>
  <!-- the one amber edge = a cross-repo ripple, emanating from the center -->
  <path d="M71 60 L94.64 40" fill="none" stroke="#D9772E" stroke-width="5" stroke-linecap="round"/>
  <!-- center diamond -->
  <path d="M60 49 L71 60 L60 71 L49 60 Z"
        fill="none" stroke="#2F5BD0" stroke-width="4" stroke-linejoin="round"/>
  <!-- nodes (the ripple endpoint is amber) -->
  <g fill="#2F5BD0">
    <circle cx="60" cy="20" r="5.5"/>
    <circle cx="94.64" cy="80" r="5.5"/>
    <circle cx="60" cy="100" r="5.5"/>
    <circle cx="25.36" cy="80" r="5.5"/>
    <circle cx="25.36" cy="40" r="5.5"/>
  </g>
  <circle cx="94.64" cy="40" r="5.5" fill="#D9772E"/>
</svg>
