name: Install check

# Installs a published release with scripts/install.sh, as users do, on old and current Linux and macOS.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to install, e.g. v0.1.0
        required: true

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Ubuntu 20.04 x64", os: ubuntu-latest, container: "ubuntu:20.04" }
          - { name: "Ubuntu 20.04 arm64", os: ubuntu-24.04-arm, container: "ubuntu:20.04" }
          - { name: "Ubuntu 24.04 x64", os: ubuntu-latest, container: "ubuntu:24.04" }
          - { name: "macOS arm64", os: macos-latest }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - if: matrix.container
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y curl ca-certificates
      - name: Install and run
        env:
          COMINDLY_VERSION: ${{ inputs.tag }}
          COMINDLY_BIN_DIR: ${{ runner.temp }}/bin
        run: |
          curl -LsSf https://raw.githubusercontent.com/sayef/comindly/main/scripts/install.sh | sh
          "$COMINDLY_BIN_DIR/comindly" --version | grep -F "${COMINDLY_VERSION#v}"
