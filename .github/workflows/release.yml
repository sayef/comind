name: Release

# Builds `comindly-<target>.tar.gz` (+ `.sha256`) for each target and attaches them to the GitHub release
# that release-plz created; scripts/install.sh downloads these.
on:
  push:
    tags: ["v*"]
  # release-plz pushes its tags with GITHUB_TOKEN, which does not trigger `push`.
  workflow_run:
    workflows: [Release-plz]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish, e.g. v0.1.0
        required: false

permissions:
  contents: read

jobs:
  tag:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      ref: ${{ steps.tag.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - id: tag
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          case "$EVENT" in
            workflow_run) tag=$(git tag --points-at HEAD --list 'v*' | sort -V | tail -n 1) ;;
            workflow_dispatch) tag=$([[ "$INPUT_TAG" == v* ]] && echo "$INPUT_TAG" || true) ;;
            *) tag=$([[ "$GITHUB_REF" == refs/tags/v* ]] && echo "$GITHUB_REF_NAME" || true) ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ref=${tag:-$(git rev-parse HEAD)}" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${tag:-none}"

  ui:
    needs: tag
    if: needs.tag.outputs.tag != '' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci && npm run build
        working-directory: ui
      - uses: actions/upload-artifact@v7
        with:
          name: ui-dist
          path: ui/dist

  build:
    needs: [tag, ui]
    if: needs.tag.outputs.tag != '' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            container: rust:1.97-bullseye # glibc 2.31: runs on Ubuntu 20.04+, Rocky 9
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            container: rust:1.97-bullseye
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest # cross-compiled on Apple Silicon
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: ui/dist
      # Debian 11's security archive is retired; the build tools come from the main archive.
      - if: runner.os == 'Linux'
        run: |
          sed -i '/bullseye-security/d' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          apt-get update && apt-get install -y protobuf-compiler cmake perl
      - if: runner.os == 'macOS'
        run: brew install protobuf cmake
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          tar -C target/${{ matrix.target }}/release -czf "comindly-${{ matrix.target }}.tar.gz" comindly
          shasum -a 256 "comindly-${{ matrix.target }}.tar.gz" > "comindly-${{ matrix.target }}.tar.gz.sha256" \
            2>/dev/null || sha256sum "comindly-${{ matrix.target }}.tar.gz" > "comindly-${{ matrix.target }}.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: comindly-${{ matrix.target }}
          path: comindly-${{ matrix.target }}.tar.gz*

  publish:
    needs: [tag, build]
    if: needs.tag.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          files: dist/*
