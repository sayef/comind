# Fast checks on every push/PR: format, clippy, and tests on a single Linux target, cached.
# The expensive cross-platform build lives in portability.yml (release tags), not here.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prereqs
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler cmake
      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
