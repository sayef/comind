# Fast checks: format + tests on a single Linux target, heavily cached.
# While the repo is PRIVATE (limited free Actions minutes) this runs on PRs + manual only,
# not on every push. Actions are free & unlimited on public repos — once comind is public,
# re-add `push: { branches: [main] }` here for per-commit CI.
name: ci

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prereqs
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler cmake
      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test
