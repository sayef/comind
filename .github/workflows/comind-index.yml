# Comind org index — clones the team's repos, builds the cross-repo graph + embeddings
# (+ optional LLM enrichment), and writes a versioned LanceDB dataset to a LOCAL path, which
# is uploaded as a downloadable GitHub Actions artifact. No S3 / AWS required.
#
# ── To enable ────────────────────────────────────────────────────────────────────────────
#   1. Edit the "Checkout … to index" steps below to your real repos.
#   2. Add secret  COMIND_REPO_TOKEN   (fine-grained PAT, Contents: read on those repos).
#      (Public repos: you can delete the `token:` lines entirely.)
#   3. (optional) Add secret  OPENAI_API_KEY  to turn on --enrich.
#   4. Set repository variable  COMIND_INDEX_ENABLED = true   (Settings → Variables) so the
#      nightly schedule starts running. Until then it no-ops instead of failing.
# ──────────────────────────────────────────────────────────────────────────────────────────
name: comind-index

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC nightly
  workflow_dispatch: # manual run (always executes, ignores the enable-variable)

concurrency:
  group: comind-index
  cancel-in-progress: true

jobs:
  index:
    # Scheduled runs only once you opt in; manual dispatch always runs.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.COMIND_INDEX_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    env:
      INDEX_DIR: ${{ runner.temp }}/comind-index/org
    steps:
      - name: Checkout comind (the engine)
        uses: actions/checkout@v4
        with:
          path: comind

      # ── Repos to index (full history so --incremental can diff commits) ──────────────────
      # Private repos need `token:`; for public repos delete the token line.
      - name: Checkout pkg-common
        uses: actions/checkout@v4
        with:
          repository: your-org/pkg-common
          path: repos/pkg-common
          fetch-depth: 0
          token: ${{ secrets.COMIND_REPO_TOKEN }}
      - name: Checkout service-a
        uses: actions/checkout@v4
        with:
          repository: your-org/service-a
          path: repos/service-a
          fetch-depth: 0
          token: ${{ secrets.COMIND_REPO_TOKEN }}
      # … add one block per repo …

      - name: Prereqs
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler cmake

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: comind

      - name: Restore previous index (enables incremental)
        uses: actions/cache@v4
        with:
          path: ${{ env.INDEX_DIR }}
          key: comind-index-${{ github.run_id }}
          restore-keys: comind-index-

      - name: Build comind
        working-directory: comind
        run: cargo build --release -p comind-cli

      - name: Build the index (local LanceDB path — no S3)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }} # optional; enables --enrich when set
        run: |
          BIN=comind/target/release/comind
          ENRICH=""
          [ -n "$OPENAI_API_KEY" ] && ENRICH="--enrich --enrich-top 200"
          "$BIN" link repos/pkg-common repos/service-a \
            --to "$INDEX_DIR" --embed --incremental $ENRICH

      - name: Upload index artifact
        uses: actions/upload-artifact@v4
        with:
          name: comind-index
          path: ${{ env.INDEX_DIR }}/_graph
          retention-days: 7
          if-no-files-found: error

# Consume it: `gh run download -R <owner>/comind -n comind-index` then
#   comind serve  --from ./_graph      (MCP)
#   comind search "…" --from ./_graph
