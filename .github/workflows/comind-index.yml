# Comind org index — clones the repos you list, builds the cross-repo graph + embeddings
# (+ optional LLM enrichment), writes a versioned LanceDB dataset to a LOCAL path, and uploads
# it as a downloadable artifact. No S3 / AWS. No repo names committed here — they live in a
# repository variable, so this file stays generic and public-safe.
#
# ── To enable ────────────────────────────────────────────────────────────────────────────
#   • Variable  COMIND_INDEX_ENABLED = true          (lets the nightly schedule run)
#   • Variable  COMIND_REPOS = "owner/pkg  owner/svc" (space/newline list of repos to index)
#   • Secret    COMIND_REPO_TOKEN                     (fine-grained PAT, Contents: read)
#                                                     — omit for public repos
#   • Secret    OPENAI_API_KEY  (optional)            — turns on --enrich
# ──────────────────────────────────────────────────────────────────────────────────────────
name: comind-index

on:
  schedule:
    - cron: "0 2 1 * *" # 02:00 UTC on the 1st of each month (nightly is wasteful while private)
  workflow_dispatch:

concurrency:
  group: comind-index
  cancel-in-progress: true

jobs:
  index:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.COMIND_INDEX_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout comind (the engine)
        uses: actions/checkout@v4
        with:
          path: comind

      - name: Clone the repos to index
        env:
          GH_TOKEN: ${{ secrets.COMIND_REPO_TOKEN }}
          REPOS: ${{ vars.COMIND_REPOS }}
        run: |
          if [ -z "$REPOS" ]; then
            echo "::error::COMIND_REPOS is empty. Add it under Settings → Secrets and variables → Actions → the VARIABLES tab (not Secrets), name COMIND_REPOS, value e.g. 'owner/repo-a owner/repo-b'."
            exit 1
          fi
          mkdir -p repos
          for slug in $REPOS; do
            name="${slug##*/}"
            if [ -n "$GH_TOKEN" ]; then
              url="https://x-access-token:${GH_TOKEN}@github.com/${slug}.git"
            else
              url="https://github.com/${slug}.git"
            fi
            echo "cloning $slug"
            git clone --quiet "$url" "repos/${name}"   # full history → --incremental can diff
          done

      - name: Prereqs
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler cmake

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: comind

      - name: Restore previous index (enables incremental)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/comind-index/org
          key: comind-index-${{ github.run_id }}
          restore-keys: comind-index-

      - name: Build comind
        working-directory: comind
        run: cargo build --release -p comind-cli

      - name: Build the index (local LanceDB path — no S3)
        env:
          INDEX_DIR: ${{ runner.temp }}/comind-index/org
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }} # optional; enables --enrich when set
        run: |
          BIN=comind/target/release/comind
          ENRICH=""
          [ -n "$OPENAI_API_KEY" ] && ENRICH="--enrich --enrich-top 200"
          "$BIN" link repos/*/ --to "$INDEX_DIR" --embed --incremental $ENRICH

      - name: Upload index artifact
        uses: actions/upload-artifact@v4
        with:
          name: comind-index
          path: ${{ runner.temp }}/comind-index/org/_graph
          retention-days: 7
          if-no-files-found: error

# Consume it: `gh run download -R <owner>/comind -n comind-index` then
#   comind serve  --from ./_graph      (MCP)
#   comind search "…" --from ./_graph
