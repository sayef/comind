name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Commands and a small repository (or fixture) that show the problem. Please use synthetic code and data.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: comind version
      description: Output of `comind --version`.
      placeholder: "0.3.0"
    validations:
      required: true
  - type: dropdown
    id: interface
    attributes:
      label: Interface
      options: [CLI, MCP server, Hooks, Web UI, Terminal UI]
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, CPU architecture, index location (local or S3), languages indexed"
